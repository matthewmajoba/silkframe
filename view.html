<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silkframe — Theatre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=Instrument+Serif:ital@0;1&family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery/gallery.css">
  <link rel="stylesheet" href="gallery/demos-cards.css">
  <link rel="stylesheet" href="gallery/demos-crumbs.css">
  <link rel="stylesheet" href="gallery/demos-ui.css">
</head>
<body class="viewer">
  <header class="v-bar">
    <a class="v-back" id="back" href="index.html"></a>
    <div class="v-title"><span class="fx-code" id="code"></span><h1 id="name"></h1></div>
    <div class="fx-actions">
      <button class="fx-btn" id="prev" title="Previous (←)" aria-label="Previous effect"></button>
      <button class="fx-btn" id="replay" title="Replay (R)" aria-label="Replay"></button>
      <button class="fx-btn" id="next" title="Next (→)" aria-label="Next effect"></button>
    </div>
  </header>
  <main class="v-stage" id="vstage">
    <div class="stage"></div>
    <span class="fx-hint" id="hint" hidden><i></i><span></span></span>
  </main>
  <footer class="v-info">
    <p id="desc"></p>
    <span class="v-keys"><kbd>←</kbd><kbd>→</kbd> browse · <kbd>R</kbd> replay</span>
  </footer>
  <script type="module" src="gallery/view.js"></script>
</body>
</html>
